<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In - Study Groups</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f4f4f9; }
        .login-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; font-size: 14px; }
        .google-button { display: flex; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #747775; border-radius: 4px; background: white; color: #1f1f1f; font-weight: 600; text-decoration: none; margin-bottom: 20px;}
        .google-button:hover { background: #f8faff; }
        .google-mark { font-family: sans-serif; font-size: 18px; font-weight: 700; color: #4285f4; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Sign In</h2>
        <div id="error" class="error" role="alert" aria-live="polite"></div>
        <a class="google-button" href="/api/auth/google"><span class="google-mark" aria-hidden="true">G</span>Continue with Google</a>
        <form id="login-form">
            <label for="email">Email:</label>
            <input type="email" id="email" required>
            <label for="password">Password:</label>
            <input type="password" id="password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>
    <script>
        const errorMessages = {
            google_not_configured: 'Google sign-in is not configured on this server.',
            google_state_mismatch: 'Google sign-in could not be verified. Please try again.',
            google_sign_in_cancelled: 'Google sign-in was cancelled.',
            google_account_exists: 'This e-mail already has an account. Sign in with your password first.',
            google_sign_in_failed: 'Google sign-in failed. Please try again.'
        };
        const errorCode = new URLSearchParams(window.location.search).get('error');
        if (errorCode) {
            document.getElementById('error').innerText = errorMessages[errorCode] || 'Sign-in failed.';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                window.location.href = '/sessions';
            } else {
                document.getElementById('error').innerText = data.error || 'Login failed';
            }
        });
    </script>
</body>
</html>
