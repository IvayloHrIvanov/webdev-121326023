<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In - Study Groups</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/app.css">
    <script src="/theme.js"></script>
</head>
<body class="login-page">
    <div class="login-box">
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
            </svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"></path>
            </svg>
        </button>
        <h2 id="login-heading">Sign In</h2>
        <div id="error" class="error" role="alert" aria-live="polite"></div>
        <div id="login-view">
            <a class="google-button" href="/api/auth/google"><span class="google-mark" aria-hidden="true">G</span>Continue with Google</a>
            <form id="login-form" novalidate>
                <label for="email">Email:</label>
                <input type="email" id="email" autocomplete="email" aria-describedby="email-error" required>
                <div id="email-error" class="error field-error" role="alert" aria-live="polite"></div>
                <label for="password">Password:</label>
                <input type="password" id="password" autocomplete="current-password" aria-describedby="password-error" style="margin-bottom: 20px;" required>
                <div id="password-error" class="error field-error" role="alert" aria-live="polite"></div>
                <button type="submit">Sign In</button>
            </form>
            <button id="show-register" class="btn-success" type="button">Register</button>
        </div>
        <div id="register-view" hidden>
            <form id="register-form" novalidate>
                <label for="register-email">Email:</label>
                <input type="email" id="register-email" autocomplete="email" maxlength="254" aria-describedby="register-email-error" required>
                <div id="register-email-error" class="error field-error" role="alert" aria-live="polite"></div>
                <label for="register-password">Password:</label>
                <input type="password" id="register-password" autocomplete="new-password" minlength="1" maxlength="128" aria-describedby="register-password-error" style="margin-bottom: 20px;" required>
                <div id="register-password-error" class="error field-error" role="alert" aria-live="polite"></div>
                <button type="submit">Create Student Account</button>
            </form>
            <button id="show-login" class="btn-success" type="button">Back to sign in</button>
        </div>
    </div>
    <script>
        const errorMessages = {
            google_not_configured: 'Google sign-in is not configured on this server.',
            google_state_mismatch: 'Google sign-in could not be verified. Please try again.',
            google_sign_in_cancelled: 'Google sign-in was cancelled.',
            google_account_exists: 'This Google account is already linked to another user.',
            google_sign_in_failed: 'Google sign-in failed. Please try again.'
        };
        const errorCode = new URLSearchParams(window.location.search).get('error');
        if (errorCode) {
            document.getElementById('error').innerText = errorMessages[errorCode] || 'Sign-in failed.';
        }

        const errorElement = document.getElementById('error');
        const heading = document.getElementById('login-heading');
        const loginView = document.getElementById('login-view');
        const registerView = document.getElementById('register-view');
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function setFieldError(input, error, message) {
            input.setAttribute('aria-invalid', 'true');
            error.innerText = message;
        }

        function clearFieldError(input, error) {
            input.removeAttribute('aria-invalid');
            error.innerText = '';
        }

        function validateEmail(input, error) {
            const email = input.value.trim();
            if (!email) {
                setFieldError(input, error, 'Please enter your email.');
                return null;
            }
            if (email.length > 254 || !emailPattern.test(email)) {
                setFieldError(input, error, 'Please enter a valid email address.');
                return null;
            }
            clearFieldError(input, error);
            return email;
        }

        function clearOnInput(input, error) {
            input.addEventListener('input', () => {
                clearFieldError(input, error);
                errorElement.innerText = '';
            });
        }

        const loginEmail = document.getElementById('email');
        const loginPassword = document.getElementById('password');
        const loginEmailError = document.getElementById('email-error');
        const loginPasswordError = document.getElementById('password-error');
        const registerEmail = document.getElementById('register-email');
        const registerPassword = document.getElementById('register-password');
        const registerEmailError = document.getElementById('register-email-error');
        const registerPasswordError = document.getElementById('register-password-error');
        clearOnInput(loginEmail, loginEmailError);
        clearOnInput(loginPassword, loginPasswordError);
        clearOnInput(registerEmail, registerEmailError);
        clearOnInput(registerPassword, registerPasswordError);

        document.getElementById('show-register').addEventListener('click', () => {
            errorElement.innerText = '';
            clearFieldError(loginEmail, loginEmailError);
            clearFieldError(loginPassword, loginPasswordError);
            clearFieldError(registerEmail, registerEmailError);
            clearFieldError(registerPassword, registerPasswordError);
            heading.innerText = 'Register';
            loginView.hidden = true;
            registerView.hidden = false;
        });

        document.getElementById('show-login').addEventListener('click', () => {
            errorElement.innerText = '';
            clearFieldError(registerEmail, registerEmailError);
            clearFieldError(registerPassword, registerPasswordError);
            heading.innerText = 'Sign In';
            registerView.hidden = true;
            loginView.hidden = false;
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            errorElement.innerText = '';
            const email = validateEmail(loginEmail, loginEmailError);
            const password = loginPassword.value;
            if (!password) {
                setFieldError(loginPassword, loginPasswordError, 'Please enter your password.');
            } else {
                clearFieldError(loginPassword, loginPasswordError);
            }
            if (!email || !password) {
                (email ? loginPassword : loginEmail).focus();
                return;
            }
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = '/sessions';
                } else {
                    errorElement.innerText = data.error || 'Login failed';
                }
            } catch {
                errorElement.innerText = 'Could not sign in. Please try again.';
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            errorElement.innerText = '';
            const email = validateEmail(registerEmail, registerEmailError);
            const password = registerPassword.value;
            if (!password) {
                setFieldError(registerPassword, registerPasswordError, 'Please enter a password.');
            } else if (password.length > 128) {
                setFieldError(registerPassword, registerPasswordError, 'Password must be no more than 128 characters.');
            } else {
                clearFieldError(registerPassword, registerPasswordError);
            }
            if (!email || !password || password.length > 128) {
                (email ? registerPassword : registerEmail).focus();
                return;
            }
            const button = e.currentTarget.querySelector('button[type="submit"]');
            button.disabled = true;
            button.innerText = 'Creating account…';
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = '/sessions';
                } else {
                    errorElement.innerText = data.error || 'Could not create your account.';
                }
            } catch {
                errorElement.innerText = 'Could not create your account. Please try again.';
            } finally {
                button.disabled = false;
                button.innerText = 'Create Student Account';
            }
        });
    </script>
</body>
</html>
