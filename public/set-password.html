<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set App Password - Study Groups</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/app.css">
    <script src="/theme.js"></script>
</head>
<body class="login-page">
    <main class="login-box">
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
            </svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"></path>
            </svg>
        </button>
        <h1>Set an app password</h1>
        <p>Your Google password is never shared with this app. Choose an app password to finish creating your account.</p>
        <p id="setup-status" role="status" aria-live="polite">Checking your account…</p>
        <p id="setup-error" class="error" role="alert" aria-live="polite"></p>
        <form id="password-form" hidden>
            <div class="form-group">
                <label for="new-password">App password:</label>
                <input id="new-password" type="password" minlength="1" maxlength="128" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm app password:</label>
                <input id="confirm-password" type="password" minlength="1" maxlength="128" autocomplete="new-password" required>
            </div>
            <button id="save-password" type="submit">Save password</button>
        </form>
    </main>
    <script>
        const statusElement = document.getElementById('setup-status');
        const errorElement = document.getElementById('setup-error');
        const form = document.getElementById('password-form');

        async function checkAccount() {
            try {
                const response = await fetch('/api/auth/me');
                if (response.status === 401) {
                    window.location.replace('/login');
                    return;
                }
                if (!response.ok) throw new Error();

                const profile = await response.json();
                if (!profile.passwordSetupRequired) {
                    window.location.replace('/sessions');
                    return;
                }

                statusElement.hidden = true;
                form.hidden = false;
            } catch {
                statusElement.hidden = true;
                errorElement.innerText = 'Could not verify your account. Please refresh and try again.';
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorElement.innerText = '';

            const password = document.getElementById('new-password').value;
            const confirmation = document.getElementById('confirm-password').value;
            if (password !== confirmation) {
                errorElement.innerText = 'The passwords do not match.';
                return;
            }

            const button = document.getElementById('save-password');
            button.disabled = true;
            button.innerText = 'Saving password…';
            try {
                const response = await fetch('/api/auth/set-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    errorElement.innerText = result.error || 'Could not save your password. Please try again.';
                    return;
                }
                window.location.assign('/sessions');
            } catch {
                errorElement.innerText = 'Could not save your password. Please try again.';
            } finally {
                button.disabled = false;
                button.innerText = 'Save password';
            }
        });

        checkAccount();
    </script>
</body>
</html>
